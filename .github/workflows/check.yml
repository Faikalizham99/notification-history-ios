name: Check shared logic and MAUI compilation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios --version 10.0.204.1
      - run: dotnet run --project tests/NotificationHistory.Tests -c Release
      - run: python -m unittest discover -s tests -p test_ipa_archive.py
      - run: dotnet build src/NotificationHistory -c Release -r iossimulator-x64 -p:EnableCodeSigning=false -p:TreatWarningsAsErrors=true
